<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FolioForge: Free Resume Builder</title><meta name="description" content="Build a clean, ATS-friendly resume in minutes. 5 templates, live preview, grammar helper, free PDF. Your data stays on your device."><meta name="theme-color" content="#5b3df5"><meta property="og:title" content="FolioForge: Free Resume Builder"><meta property="og:description" content="5 templates, live preview, free PDF. No sign-up."><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<style>
:root{--bg:#f4f3ff;--cd:#fff;--tx:#1b1740;--mu:#6b6890;--bd:#dcd9f5;--ac:#5b3df5;--ac2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f0d1f;--cd:#1a1736;--tx:#ece9ff;--mu:#9a96c4;--bd:#332f5e;--ac:#8f7bff;--ac2:#0f0d1f}}
:root[data-theme=dark]{--bg:#0f0d1f;--cd:#1a1736;--tx:#ece9ff;--mu:#9a96c4;--bd:#332f5e;--ac:#8f7bff;--ac2:#0f0d1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cd);border-bottom:1px solid var(--bd);padding:8px 12px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.top b{font-size:20px;letter-spacing:-.02em;line-height:1.1}.top b span{background:linear-gradient(90deg,#5b3df5,#d946ef);-webkit-background-clip:text;background-clip:text;color:transparent}.top small{display:block;color:var(--mu);font-size:11px;font-weight:400;letter-spacing:0}details{box-shadow:0 1px 4px rgba(70,50,170,.1);border-radius:14px}
.pri{white-space:nowrap;background:linear-gradient(135deg,#5b3df5,#c026d3);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(91,61,245,.35)}.fx{margin-top:6px;border:1px solid var(--ac);background:none;color:var(--ac);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;display:none;gap:12px;align-items:center;z-index:9;font-size:14px}#toast button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--bd);background:var(--bg);border-radius:16px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.chips button.on,.tabs button.on{border-color:var(--ac);background:var(--ac);color:var(--ac2)}
.tabs{display:none;gap:6px;padding:8px 12px 0}
.tabs button{flex:1;border:1px solid var(--bd);background:var(--cd);border-radius:8px;padding:8px;cursor:pointer}
.wrap{display:grid;grid-template-columns:430px 1fr;gap:16px;padding:12px;align-items:start}
#ed{min-width:0}
details{background:var(--cd);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
summary{padding:12px 14px;font-weight:600;cursor:pointer}
details>.g{padding:0 14px 14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.w{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mu)}
label input,label textarea{display:block;width:100%;margin-top:2px;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);font-size:15px}
.card{border:1px solid var(--bd);border-radius:8px;padding:10px}
.del,.add,.clr{border:1px solid var(--bd);background:none;border-radius:6px;padding:7px;cursor:pointer;margin-top:8px}
.del{color:#c0392b}
.clr{width:100%}
#pvw{position:sticky;top:96px;min-width:0}
#sc{overflow:hidden;width:100%}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin-bottom:6px}
.hint{color:var(--mu);font-size:12px;margin-top:8px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.tabs{display:flex}#pvw{position:static}body[data-tab=ed] #pvw{display:none}body[data-tab=pv] #ed{display:none}}
.pg{position:relative;width:794px;min-height:1123px;background:#fff;color:#222;padding:12mm;transform-origin:0 0;font:13.5px/1.45 Arial,Helvetica,sans-serif;box-shadow:0 1px 8px rgba(0,0,0,.2)}
.pg *{margin:0}
.pg h1{font-size:30px;line-height:1.15}
.pg h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px;break-after:avoid}
.pg .it{margin-bottom:8px;break-inside:avoid}
.pg .r{display:flex;justify-content:space-between;gap:10px}
.pg i{font-style:normal;color:#666;white-space:nowrap;font-size:12px}
.pg .s{color:#555}
.pg ul{padding-left:18px;margin-top:3px}
.pg a{color:inherit}
.cols{display:flex;flex-direction:column}
.cols aside,.cols main{display:contents}
[data-s=sum]{order:1}[data-s=sk]{order:2}[data-s=exp]{order:3}[data-s=edu]{order:4}[data-s=proj]{order:5}[data-s=ce]{order:6}[data-s=lg]{order:7}
.t1{font-family:Georgia,'Times New Roman',serif}
.t1 header{text-align:center;border-bottom:1px solid #222;padding-bottom:10px}
.t1 h1{font-weight:400;letter-spacing:.04em}
.t1 .tt{font-style:italic;margin-top:3px}
.t1 .ct,.t2 .ct,.t5 .ct{margin-top:6px;font-size:12px}
.t1 h2{border-bottom:1px solid #bbb;padding-bottom:2px;font-weight:400}
.t2 header{background:linear-gradient(120deg,#1f3a5f,#2f6fab);color:#fff;padding:18px 20px;border-radius:4px}
.t2 .tt{margin-top:3px;opacity:.9}
.t2 h2{color:#1f3a5f;border-left:4px solid #1f3a5f;padding-left:8px}
.t3{color:#000}
.t3 h1{font-size:26px}
.t3 .ct{margin-top:4px}
.t3 h2{border-bottom:1.5px solid #000;padding-bottom:2px}
.t3 i{color:#000}
.t4 header{border-left:8px solid #d85a30;padding-left:14px;margin-bottom:10px}
.t4 h1{color:#d85a30;font-size:34px}
.t4 .tt{font-size:16px;color:#444}
.t4 .ct{margin-top:4px;font-size:12px}
.t4 .cols{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:start}
.t4 aside,.t4 main{display:block}
.t4 aside{background:#faf1ec;padding:2px 14px 14px;border-radius:6px}
.t4 h2{color:#993c1d;border-bottom:2px solid #d85a30;padding-bottom:2px}
.t4 .sk{display:block}
.t5 header{text-align:center}
.t5 h1{color:#0f6e56}
.t5 h2{background:#e1f5ee;color:#085041;padding:3px 8px;border-radius:3px}
.t5 [data-s=edu]{order:2}.t5 [data-s=proj]{order:3}.t5 [data-s=sk]{order:4}.t5 [data-s=exp]{order:5}
.t5 .sk{display:inline-block;background:#e1f5ee;color:#085041;padding:1px 9px;border-radius:10px;margin:0 4px 4px 0}
.t4 u,.t5 u{display:none}
u{text-decoration:none}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A4;margin:12mm}
@media print{html,body{background:#fff}.ui{display:none!important}.wrap{display:block;padding:0}#pvw{position:static}#sc{height:auto!important;overflow:visible}#paper{transform:none!important;width:auto;min-height:0;padding:0;box-shadow:none}}
</style></head>
<body data-tab="ed">
<div class="top ui">
  <div class="row"><b><span>◆ FolioForge</span><small>Free resume builder. Private: stays on your device</small></b><button class="pri" id="dl">Download PDF</button></div>
  <div class="chips" id="chips"></div>
</div>
<div class="tabs ui"><button data-tab="ed" class="on">Edit</button><button data-tab="pv">Preview</button></div>
<div class="wrap">
  <div id="ed" class="ui"></div>
  <div id="pvw">
    <div class="meta ui"><span id="pgs"></span><span id="sv">Saved on this device</span></div>
    <div id="sc"><div id="paper" class="pg t1"></div></div>
    <p class="hint ui">To save: tap Download PDF, then choose "Save as PDF", paper size A4, and turn off "Headers and footers".</p>
  </div>
</div>
<script>
var K='rb1',TN=['Minimal','Corporate','ATS-friendly','Creative','Fresher'];
var blank={name:'',title:'',email:'',phone:'',loc:'',links:'',summary:'',skills:'',langs:'',certs:'',exp:[],edu:[],proj:[],tpl:1};
var sample={name:'Priya Sharma',title:'Sales Operations Analyst',email:'priya@example.com',phone:'+91 98765 43210',loc:'Pune, India',links:'linkedin.com/in/priyasharma',summary:'Detail-oriented sales operations professional with experience in order management, MIS reporting and Excel-based process improvement.',skills:'Excel, MIS reporting, Order management, Data analysis, KPI tracking',langs:'English (Fluent), Hindi (Native)',certs:'Advanced Excel, Coursera',tpl:1,
exp:[{role:'Sales Operations Executive',company:'ABC Retail Ltd',place:'Pune',start:'Jun 2022',end:'Present',desc:'Managed daily sales orders and kept accurate records\nPrepared weekly MIS reports for the sales team\nBuilt Excel trackers to monitor productivity'}],
edu:[{deg:'B.Com',inst:'Savitribai Phule Pune University',start:'2018',end:'2021',grade:'First class'}],
proj:[{name:'Productivity tracker',tech:'Excel',link:'',desc:'Automated a weekly productivity report for the team'}]};
var S;
try{var v=JSON.parse(localStorage.getItem(K));S=v?Object.assign({},blank,v):JSON.parse(JSON.stringify(sample))}catch(x){S=JSON.parse(JSON.stringify(sample))}
var $=function(i){return document.getElementById(i)},ed=$('ed'),paper=$('paper'),sc=$('sc');
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function L(s){return String(s||'').split('\n').map(function(x){return x.trim()}).filter(Boolean)}
function ul(s){var l=L(s);return l.length?'<ul>'+l.map(function(x){return'<li>'+e(x.replace(/^[-•*]\s*/,''))+'</li>'}).join('')+'</ul>':''}
function lk(s){return String(s||'').split(/[\n,]+/).map(function(x){return x.trim()}).filter(Boolean).map(function(x){var u=/^https?:\/\//i.test(x)?x:'https://'+x;return'<a href="'+e(u)+'">'+e(x.replace(/^https?:\/\/(www\.)?/i,''))+'</a>'})}
function sk(s){var a=String(s||'').split(/[,\n]+/).map(function(x){return x.trim()}).filter(Boolean);return a.map(function(x,i){return'<span class="sk">'+e(x)+(i<a.length-1?'<u>, </u>':'')+'</span>'}).join('')}
function dt(a,b){return e([a,b].filter(Boolean).join(' – '))}
function sec(id,h,b){return b?'<section data-s="'+id+'"><h2>'+h+'</h2>'+b+'</section>':''}
function render(){
  var x=S,ct=[x.email,x.phone,x.loc].filter(Boolean).map(e).concat(lk(x.links)).join(' &nbsp;|&nbsp; ');
  var exp=x.exp.map(function(p){return'<div class="it"><div class="r"><b>'+e(p.role)+'</b><i>'+dt(p.start,p.end)+'</i></div><div class="s">'+e([p.company,p.place].filter(Boolean).join(', '))+'</div>'+ul(p.desc)+'</div>'}).join('');
  var edu=x.edu.map(function(p){return'<div class="it"><div class="r"><b>'+e(p.deg)+'</b><i>'+dt(p.start,p.end)+'</i></div><div class="s">'+e(p.inst)+'</div>'+(p.grade?'<div class="s">'+e(p.grade)+'</div>':'')+'</div>'}).join('');
  var pr=x.proj.map(function(p){return'<div class="it"><div class="r"><b>'+e(p.name)+'</b><i>'+(p.link?lk(p.link)[0]:'')+'</i></div>'+(p.tech?'<div class="s">'+e(p.tech)+'</div>':'')+ul(p.desc)+'</div>'}).join('');
  paper.className='pg t'+x.tpl;
  paper.innerHTML='<header><h1>'+e(x.name||'Your name')+'</h1><div class="tt">'+e(x.title)+'</div><div class="ct">'+ct+'</div></header><div class="cols"><aside>'+sec('sk','Skills',sk(x.skills))+sec('lg','Languages',sk(x.langs))+sec('ce','Certifications',ul(x.certs))+'</aside><main>'+sec('sum','Summary',x.summary?'<p>'+e(x.summary)+'</p>':'')+sec('exp','Experience',exp)+sec('edu','Education',edu)+sec('proj','Projects',pr)+'</main></div>';
  fit();
}
function fit(){var w=$('pvw').clientWidth;if(!w)return;var s=Math.min(1,w/794);paper.style.transform='scale('+s+')';sc.style.height=paper.offsetHeight*s+'px';var n=Math.max(1,Math.ceil((paper.offsetHeight-90)/1033));$('pgs').textContent='About '+n+' page'+(n>1?'s':'')+' (A4)'}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(x){$('sv').textContent='Not saved (storage off)'}}
function fld(l,a,v,ta){return'<label'+(ta?' class="w"':'')+'>'+l+(ta?'<textarea rows="3" '+a+'>'+e(v)+'</textarea>'+(/summary|desc/.test(a)?'<button type="button" class="fx">✨ Fix grammar</button>':''):'<input '+a+' value="'+e(v)+'">')+'</label>'}
function tf(l,k,ta){return fld(l,'data-k="'+k+'"',S[k],ta)}
var LS={exp:['Experience',[['Job title','role'],['Company','company'],['Location','place'],['Start','start'],['End (or Present)','end'],['What you did (one line each)','desc',1]],'Add job'],
edu:['Education',[['Degree','deg'],['Institution','inst'],['Start','start'],['End','end'],['Grade / notes','grade']],'Add education'],
proj:['Projects',[['Project name','name'],['Link','link'],['Technologies','tech'],['Details (one line each)','desc',1]],'Add project']};
function build(open){
  var op={};[].forEach.call(ed.querySelectorAll('details[open]'),function(d){op[d.id]=1});if(open)op[open]=1;if(!ed.children.length){op['d-me']=1;op['d-sum']=1}
  function det(id,t,b){return'<details id="'+id+'"'+(op[id]?' open':'')+'><summary>'+t+'</summary><div class="g">'+b+'</div></details>'}
  function list(l){var d=LS[l];return det('d-'+l,d[0],S[l].map(function(_,i){return'<div class="card w"><div class="g">'+d[1].map(function(f){return fld(f[0],'data-l="'+l+'" data-i="'+i+'" data-f="'+f[1]+'"',S[l][i][f[1]],f[2])}).join('')+'</div><button class="del" data-del="'+l+':'+i+'">Remove</button></div>'}).join('')+'<button class="add w" data-add="'+l+'">+ '+d[2]+'</button>')}
  ed.innerHTML=det('d-me','Personal details',tf('Full name','name')+tf('Job title','title')+tf('Email','email')+tf('Phone','phone')+tf('Location','loc')+tf('Links (one per line)','links',1))+
  det('d-sum','Summary',tf('A few lines about you','summary',1))+list('exp')+list('edu')+
  det('d-sk','Skills',tf('Skills (separate with commas)','skills',1))+list('proj')+
  det('d-more','Certifications and languages',tf('Certifications (one per line)','certs',1)+tf('Languages, e.g. English (Fluent), Hindi (Native)','langs',1))+
  '<button class="clr" id="clr">Start with a blank resume</button>';
}
ed.addEventListener('input',function(ev){var t=ev.target,d=t.dataset;if(d.k)S[d.k]=t.value;else if(d.l)S[d.l][+d.i][d.f]=t.value;else return;save();render()});
ed.addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;if(b.className==='fx'){fix(b);return}var d=b.dataset;
  if(d.add){S[d.add].push({});build('d-'+d.add);save();render()}
  else if(d.del){var p=d.del.split(':');S[p[0]].splice(+p[1],1);build();save();render()}
  else if(b.id==='clr'){if(b.dataset.s){S=JSON.parse(JSON.stringify(blank));S.exp.push({});S.edu.push({});build('d-me');save();render()}else{b.dataset.s=1;b.textContent='Tap again to erase everything'}}});
$('chips').innerHTML=TN.map(function(n,i){return'<button data-t="'+(i+1)+'">'+(i+1)+'. '+n+'</button>'}).join('');
function chips(){[].forEach.call($('chips').children,function(b){b.className=+b.dataset.t===S.tpl?'on':''})}
$('chips').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;S.tpl=+b.dataset.t;chips();save();render()});
[].forEach.call(document.querySelectorAll('.tabs button'),function(b){b.onclick=function(){document.body.dataset.tab=b.dataset.tab;[].forEach.call(document.querySelectorAll('.tabs button'),function(o){o.className=o===b?'on':''});setTimeout(fit,0);window.scrollTo(0,0)}});
$('dl').onclick=function(){if(innerWidth<=900&&document.body.dataset.tab!=='pv')document.querySelector('.tabs [data-tab=pv]').click();try{window.print()}catch(x){alert('Printing is blocked here. Open this page in its own browser tab and try again.')}};
window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe($('pvw'));
var TY={teh:'the',recieve:'receive',recieved:'received',managment:'management',responsibile:'responsible',reponsible:'responsible',experiance:'experience',sucessful:'successful',sucess:'success',definately:'definitely',seperate:'separate',occured:'occurred',acheived:'achieved',acheive:'achieve',adress:'address',buisness:'business',comunication:'communication',knowlege:'knowledge',enviroment:'environment',independant:'independent',maintainance:'maintenance',prefered:'preferred',wich:'which',alot:'a lot',developement:'development',dont:"don't",cant:"can't",doesnt:"doesn't",didnt:"didn't",wont:"won't",isnt:"isn't",im:"I'm",ive:"I've"};
function fixLine(s){
  s=s.replace(/\s+/g,' ').trim();
  s=s.replace(/\b[A-Za-z']+\b/g,function(w){var r=TY[w.toLowerCase()];return r?(/^[A-Z]/.test(w)?r[0].toUpperCase()+r.slice(1):r):w});
  s=s.replace(/\bi(?=[\s',]|$)/g,'I').replace(/\b(\w+)( \1\b)+/gi,'$1').replace(/ +([,.;:!?])/g,'$1');
  s=s.replace(/([,;:!?])(?=[A-Za-z])/g,'$1 ').replace(/([a-z])\.(?=[A-Z])/g,'$1. ');
  s=s.replace(/\ba (?!one\b|once\b|u)(?=[aeio]\w)/gi,function(m){return m[0]==='A'?'An ':'an '});
  s=s.replace(/(^|[.!?] )([a-z])/g,function(m,a,b,off,str){if(a&&/(\be\.g|\bi\.e|\betc|\bvs)\.$/i.test(str.slice(0,off+1)))return m;return a+b.toUpperCase()}).replace(/^([-•*] )([a-z])/,function(m,a,b){return a+b.toUpperCase()});
  return s}
var tm,tt=document.createElement('div');tt.id='toast';tt.className='ui';document.body.appendChild(tt);
function toast(m,u){clearTimeout(tm);tt.innerHTML='<span>'+m+'</span>'+(u?'<button>Undo</button>':'');tt.style.display='flex';if(u)tt.lastChild.onclick=function(){u();tt.style.display='none'};tm=setTimeout(function(){tt.style.display='none'},5000)}
function fix(b){var ta=b.parentNode.querySelector('textarea'),o=ta.value,n=o.split('\n').map(fixLine).join('\n');
  if((ta.getAttribute('data-k')||'')==='summary'&&n&&!/[.!?]$/.test(n))n+='.';
  if(n===o){toast('Looks good. Nothing to fix.');return}
  var ev=function(){ta.dispatchEvent(new Event('input',{bubbles:true}))};ta.value=n;ev();toast('Grammar fixed.',function(){ta.value=o;ev()})}
build();chips();render();
</script></body></html>
